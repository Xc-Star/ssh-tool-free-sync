# Self-hosted MySQL for SSH Tool sync (MariaDB works as well: image mariadb:11).
#
#   docker compose -f deploy/docker-compose.mysql.yml up -d
#
# Then in SSH Tool → Settings → Sync choose MySQL / MariaDB and use:
#   mysql://sshtool:<password>@<your-server>:3306/sshtool
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change-me-root-password
      MYSQL_DATABASE: sshtool
      MYSQL_USER: sshtool
      MYSQL_PASSWORD: change-me-to-a-long-random-password
    ports:
      - '3306:3306'
    volumes:
      - sshtool-mysql:/var/lib/mysql

volumes:
  sshtool-mysql:
