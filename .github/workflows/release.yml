name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --win --x64
          - name: macos
            os: macos-latest
            args: --mac --x64 --arm64
          - name: linux-x64
            os: ubuntu-latest
            args: --linux --x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            args: --linux --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential python3 libudev-dev rpm xvfb
          # Ubuntu 24.04 blocks the unprivileged user namespaces that Chromium's sandbox needs (smoke test).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package
        shell: bash
        run: |
          if [ -z "$CSC_LINK" ]; then
            # No certificate configured. An empty CSC_LINK must not reach electron-builder: on macOS it is
            # resolved as a certificate path (the project folder) and packaging fails with "... not a file".
            unset CSC_LINK CSC_KEY_PASSWORD
            # Sign the macOS app ad hoc instead. electron-builder otherwise leaves the app with a broken
            # signature, which Apple Silicon Macs report as "damaged"; an ad-hoc signed app gets the usual
            # "Open Anyway" flow (System Settings → Privacy & Security).
            if [ "$RUNNER_OS" = "macOS" ]; then set -- --config.mac.identity=-; fi
          fi
          npx electron-builder ${{ matrix.args }} --publish never "$@"
        env:
          # Unsigned by default. Add CSC_LINK / CSC_KEY_PASSWORD secrets (and Apple notarization variables) to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # The exact build that gets released must start and run a local shell (tests/package).
      - name: Smoke-test the packaged app
        if: runner.os != 'Linux'
        run: npm run test:package
      - name: Smoke-test the packaged app (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.rpm
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.name }}
          path: test-results/
          if-no-files-found: ignore

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          (cd dist && find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt && cat SHA256SUMS.txt)
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else : > release-notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          name: SSH Tool ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: true
